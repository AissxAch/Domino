<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algerian Dominoes Online</title>
    
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dominoes.css">
</head>
<body>
    <div id="app">
        <!-- Main Menu -->
        <div id="main-menu" class="screen active">
            <div class="glass-panel">
                <h1>Dominoes</h1>
                <p class="subtitle">Algerian Rules • Multiplayer</p>
                
                <div class="menu-actions">
                    <button id="btn-host" class="primary-btn">Host Game</button>
                    <div class="divider"><span>OR</span></div>
                    <div class="join-container">
                        <input type="text" id="join-code" placeholder="Enter Room Code" autocomplete="off">
                        <button id="btn-join" class="secondary-btn">Join Game</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen hidden">
            <div class="glass-panel">
                <h2>Game Lobby</h2>
                <div class="room-code-display">
                    <p>Room Code:</p>
                    <h3 id="display-room-code">----</h3>
                    <button id="btn-copy-code" class="small-btn">Copy</button>
                </div>

                <div class="players-list">
                    <h3>Players (<span id="player-count">1</span>/4)</h3>
                    <ul id="lobby-players">
                        <!-- Player items populated by JS -->
                    </ul>
                </div>
                
                <div class="lobby-actions">
                    <button id="btn-start-game" class="primary-btn hidden">Start Game</button>
                    <button id="btn-leave-lobby" class="danger-btn">Leave</button>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <!-- Top section (Opponent 1 or Team 2) -->
            <div class="opponent top-opponent">
                <div class="player-info" id="player-top-info">
                    <span class="player-name">Waiting...</span>
                    <span class="player-score">Score: 0</span>
                </div>
                <div class="opponent-hand" id="hand-top"></div>
            </div>

            <!-- Middle Section (Board and Side Opponents) -->
            <div class="game-middle">
                <!-- Left Opponent -->
                <div class="opponent left-opponent">
                    <div class="player-info" id="player-left-info">
                        <span class="player-name">Waiting...</span>
                        <span class="player-score">0</span>
                    </div>
                    <div class="opponent-hand vertical-hand" id="hand-left"></div>
                </div>

                <!-- Playing Board -->
                <div class="board-container">
                    <div id="board" class="board"></div>
                </div>

                <!-- Right Opponent -->
                <div class="opponent right-opponent">
                    <div class="player-info" id="player-right-info">
                        <span class="player-name">Waiting...</span>
                        <span class="player-score">0</span>
                    </div>
                    <div class="opponent-hand vertical-hand" id="hand-right"></div>
                </div>
            </div>

            <!-- Bottom Section (Local Player) -->
            <div class="local-player">
                <div class="game-controls">
                    <button id="btn-pass" class="warning-btn hidden">Pass Turn</button>
                    <div id="turn-indicator" class="turn-indicator">Waiting...</div>
                </div>
                <div class="local-hand-container">
                    <div class="player-info local-info" id="player-local-info">
                        <span class="player-name">You</span>
                        <span class="player-score">Score: 0</span>
                    </div>
                    <div id="local-hand" class="local-hand"></div>
                </div>
            </div>

            <!-- End Round / Game Modal -->
            <div id="game-over-modal" class="modal hidden">
                <div class="glass-panel modal-content">
                    <h2 id="game-over-title">Round Over!</h2>
                    <p id="game-over-message"></p>
                    <div id="score-board"></div>
                    <button id="btn-next-round" class="primary-btn hidden">Next Round</button>
                    <button id="btn-back-menu" class="secondary-btn">Back to Menu</button>
                </div>
            </div>
            
            <div id="toast-container"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/peer-network.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
