<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Algerian Dominoes Online</title>
    <meta name="description" content="Play Algerian Dominoes online with friends. Real-time multiplayer P2P game.">
    
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dominoes.css">
</head>
<body>
    <div id="app">
        <!-- ========= MAIN MENU ========= -->
        <div id="main-menu" class="screen active">
            <div class="glass-panel">
                <h1>Dominoes</h1>
                <p class="subtitle">Algerian Rules • Online Multiplayer</p>
                
                <div class="menu-actions">
                    <input type="text" id="player-name" placeholder="Your Name" autocomplete="off" maxlength="12">
                    <button id="btn-host" class="primary-btn">🏠 Host Game</button>
                    <div class="divider"><span>OR</span></div>
                    <input type="text" id="join-code" placeholder="Room Code" autocomplete="off" style="text-transform:uppercase; text-align:center; letter-spacing:3px; font-weight:700;">
                    <button id="btn-join" class="secondary-btn">🔗 Join Game</button>
                </div>
                <div id="status-log" class="status-log hidden"></div>
            </div>
        </div>

        <!-- ========= LOBBY ========= -->
        <div id="lobby-screen" class="screen">
            <div class="glass-panel">
                <h2>Game Lobby</h2>
                <div class="room-code-display">
                    <p>Share this code:</p>
                    <h3 id="display-room-code">----</h3>
                    <button id="btn-copy-code" class="small-btn">📋 Copy</button>
                </div>
                <div class="players-list">
                    <h3>Players (<span id="player-count">1</span>/4)</h3>
                    <ul id="lobby-players"></ul>
                </div>
                <div class="lobby-actions">
                    <button id="btn-start-game" class="primary-btn hidden">▶ Start Game</button>
                    <button id="btn-leave-lobby" class="danger-btn">✖ Leave</button>
                </div>
            </div>
        </div>

        <!-- ========= GAME SCREEN ========= -->
        <div id="game-screen" class="screen">

            <!-- Top bar: opponents + game info -->
            <div class="game-top-bar">
                <div class="opponent-slot" id="opp-slot-0">
                    <div class="opponent-badge" id="opp-badge-0">
                        <span class="opp-name">---</span>
                        <span class="opp-score">0 pts</span>
                        <span class="opp-tiles">🁣 0</span>
                    </div>
                </div>

                <div class="game-info-center">
                    <div class="reserve-badge">
                        <span class="reserve-icon">📦</span>
                        Reserve: <strong id="reserve-count">0</strong>
                    </div>
                </div>

                <div class="opponent-slot" id="opp-slot-1">
                    <div class="opponent-badge" id="opp-badge-1">
                        <span class="opp-name">---</span>
                        <span class="opp-score">0 pts</span>
                        <span class="opp-tiles">🁣 0</span>
                    </div>
                </div>

                <div class="opponent-slot" id="opp-slot-2">
                    <div class="opponent-badge" id="opp-badge-2">
                        <span class="opp-name">---</span>
                        <span class="opp-score">0 pts</span>
                        <span class="opp-tiles">🁣 0</span>
                    </div>
                </div>
            </div>

            <!-- The felt table board -->
            <div class="board-area">
                <div class="board-scroller">
                    <div id="board" class="board">
                        <div class="board-empty">Place first tile</div>
                    </div>
                </div>
            </div>

            <!-- Bottom: controls + hand -->
            <div class="player-bottom">
                <div class="controls-row">
                    <div id="turn-indicator" class="turn-badge">Waiting...</div>
                    <button id="btn-draw" class="action-btn draw-btn hidden">📥 Draw (<span id="draw-count">0</span>)</button>
                    <button id="btn-pass" class="action-btn pass-btn hidden">Pass</button>
                </div>
                <div class="hand-tray" id="hand-tray">
                    <div class="player-info-inline" id="player-local-info">
                        <span class="pi-name">You</span>
                        <span class="pi-score">0 pts</span>
                    </div>
                    <div id="local-hand" style="display:flex; gap:4px; align-items:flex-end; justify-content:center; flex:1;"></div>
                </div>
            </div>

            <!-- Game Over Modal -->
            <div id="game-over-modal" class="modal hidden">
                <div class="glass-panel modal-content">
                    <h2 id="game-over-title">Round Over!</h2>
                    <p id="game-over-message"></p>
                    <div id="score-board"></div>
                    <button id="btn-next-round" class="primary-btn hidden">Next Round</button>
                    <button id="btn-back-menu" class="secondary-btn">Back to Menu</button>
                </div>
            </div>
            
            <div id="toast-container"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="env.js"></script>
    <script src="js/peer-network.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
